; Model presets for qinda-llm.service (llama-server --models-preset).
; Keys are llama-server arguments without the leading dashes. Clients pick a
; model by section name ("model": "ornith"); the router loads it on demand and
; unloads the other, since only one fits in memory.
;
; GPU/CPU placement is not set here: llama-server's --fit (on by default)
; keeps every layer on the GPU except as many MoE expert tensors as needed to
; leave 1 GiB of VRAM free, measured when the model loads. It adapts to
; whatever else is using the card.
version = 1

[*]
; Agentic coding tools send 15-30k-token prompts; 128k leaves room to work.
; These models use gated-delta-net layers with attention every 4th layer,
; so a q8_0 KV cache for 128k tokens is only ~1.3 GB.
ctx-size = 131072
cache-type-k = q8_0
cache-type-v = q8_0
; Two slots sharing one KV pool: the agent's main conversation keeps its
; cached prompt while side requests (titles, summaries) use the other slot.
parallel = 2
kv-unified = true
; Prompt reading streams the CPU-resident experts to the GPU once per
; micro-batch, so bigger batches read prompts faster. Measured on qinda with
; the desktop running, 15.9k-token prompt: 512 -> 127 t/s, 2048 -> 204 t/s
; (generation 20 t/s either way), 4096 -> 270 t/s but generation 17 t/s
; because its larger compute buffer moves more experts off the GPU.
batch-size = 2048
ubatch-size = 2048
; Host-RAM prompt cache for idle slots (default 8 GiB is too much here).
cache-ram = 4096
jinja = true
; Sampling recommended by both model cards for coding.
temp = 0.6
top-p = 0.95
top-k = 20
min-p = 0.0

[ornith]
; sci-ml/gguf-coding-models[ornith-1-5-35b-a3b]
model = /usr/share/gguf/Ornith-1.5-35B-A3B-Q5_K_M.gguf
load-on-startup = true

[qwen3.6]
; sci-ml/gguf-coding-models[qwen3-6-35b-a3b]
model = /usr/share/gguf/Qwen3.6-35B-A3B-UD-Q5_K_XL.gguf
